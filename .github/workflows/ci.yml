name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate
        run: .github/scripts/validate.sh

  # `ruby -c` only proves a formula parses. brew style and brew audit understand
  # Homebrew semantics it cannot see — component order, dependency order, a
  # `version` stanza that merely restates what the URL already implies — which
  # is what the automated updates in update-formula.yml rewrite.
  #
  # macOS because every formula here is `depends_on :macos`. Note this does not
  # run on the update workflow's own PRs: GitHub starts no workflow runs for
  # pull requests opened with GITHUB_TOKEN, so for those it acts as a post-merge
  # backstop via the push trigger above.
  audit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install this checkout as a tap
        run: |
          set -euo pipefail
          tap_dir="$(brew --repository)/Library/Taps/takitake/homebrew-tap"
          # rm first: cp -R into an existing directory nests the copy one level
          # deeper, which would leave brew auditing an empty tap and passing.
          rm -rf "$tap_dir"
          mkdir -p "$tap_dir"
          cp -R "$GITHUB_WORKSPACE/." "$tap_dir/"

          # brew style and brew audit both succeed on a tap with no formulae, so
          # confirm they are about to inspect the ones we came here to check.
          expected="$(find "$GITHUB_WORKSPACE/Formula" -name '*.rb' | wc -l | tr -d ' ')"
          actual="$(find "$tap_dir/Formula" -name '*.rb' | wc -l | tr -d ' ')"
          echo "formulae in tap: ${actual} (expected ${expected})"
          [ "$actual" -gt 0 ] && [ "$actual" -eq "$expected" ]

      - name: brew style
        run: brew style TakiTake/tap

      - name: brew audit
        run: brew audit --tap TakiTake/tap
