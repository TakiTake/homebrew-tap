name: rerun-unacquired

# Undoes the one failure mode this repository sees that has nothing to do with
# its contents: GitHub failing to hand a queued job to a hosted runner. See
# .github/scripts/rerun-unacquired.sh for the signature and why a rerun is the
# whole fix. Kept in its own workflow rather than folded into the two it
# watches, because a run that never started cannot repair itself.

on:
  workflow_run:
    workflows: [ci, update-formula]
    types: [completed]

permissions: {}

# Serialised per run, not globally: two different runs may both need a rerun,
# and neither should cancel the other. `cancel-in-progress: false` for the same
# reason it is false in update-formula — a cancellation here would silently drop
# a rerun that nothing else will retry.
concurrency:
  group: rerun-unacquired-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    # `run_attempt < 3` bounds the loop: a rerun completes and fires this
    # workflow again, so without the bound a run that could never get a runner
    # would retry forever. Two extra attempts is already far past the point
    # where the cause is plausibly transient.
    #
    # The continuation is at the same indentation on purpose: a `>-` block keeps
    # the newline when the next line is indented further, and an expression that
    # must reach Actions as one line cannot carry one.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The only write this needs, and the reason for the pinned checkout below.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pinned to the default branch explicitly. ci runs on pull_request, so
          # a fork's head sits within reach of the event payload, and this job
          # holds `actions: write` — checking out anything but reviewed code
          # here would hand that token to whatever a fork chose to push. The ref
          # is stated rather than left to the default so it cannot drift.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Rerun the run if a job never reached a runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: .github/scripts/rerun-unacquired.sh
